{% extends "base.html" %}
{% block title %}500 - Server Error | ElectVote{% endblock %}

{% block content %}
<div class="error-page d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center">
        <div class="error-code display-1 fw-900 gradient-text mb-3">500</div>
        <h2 class="fw-800 mb-3">Internal Server Error</h2>
        <p class="text-muted mb-4">Something went wrong on our end. We're working to fix it.</p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-primary rounded-pill px-4">
                <i class="fas fa-home me-2"></i>Go Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="fas fa-redo me-2"></i>Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
