{% extends "base.html" %}
{% block title %}404 - Page Not Found | ElectVote{% endblock %}

{% block content %}
<div class="error-page d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center">
        <div class="error-code display-1 fw-900 gradient-text mb-3">404</div>
        <h2 class="fw-800 mb-3">Page Not Found</h2>
        <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-primary rounded-pill px-4">
                <i class="fas fa-home me-2"></i>Go Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="fas fa-arrow-left me-2"></i>Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
